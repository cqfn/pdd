---
AllCops:
  Exclude:
    - 'bin/**/*'
    - 'assets/**/*'
    - 'vendor/**/**'
  DisplayCopNames: true
  TargetRubyVersion: 2.3
  NewCops: enable
  SuggestExtensions: false
plugins:
  - rubocop-rake
  - rubocop-minitest
  - rubocop-performance
  - rubocop-elegant
Minitest/EmptyLineBeforeAssertionMethods:
  Enabled: false
Gemspec/RequiredRubyVersion:
  Enabled: false
Layout/EmptyLineAfterGuardClause:
  Enabled: false
Metrics/CyclomaticComplexity:
  Max: 10
Metrics/PerceivedComplexity:
  Max: 15
Layout/EndOfLine:
  EnforcedStyle: lf
Metrics/ClassLength:
  Max: 360
Layout/LineLength:
  Max: 90
Metrics/MethodLength:
  Max: 35
Metrics/AbcSize:
  Max: 40
Style/MultilineBlockChain:
  Enabled: false
Metrics/BlockLength:
  Max: 50
Style/FrozenStringLiteralComment:
  Enabled: false
Elegant/NoClassInModule:
  Exclude:
    - 'lib/**/*'
    - 'utils/**/*'
    - '**/test_*.rb'
    - '**/*Test.rb'
Elegant/ClassInModule:
  Exclude:
    - 'lib/**/*'
    - 'utils/**/*'
    - '**/test_*.rb'
    - '**/*Test.rb'
Elegant/GoodMethodName:
  Exclude:
    - '**/test_*.rb'
    - '**/*Test.rb'
  AllowedNames:
    - 'match_markers'
    - 'get_no_leading_space_error'
    - 'get_no_puzzle_marker_error'
    - 'get_space_after_hash_error'
    - 'puzzle_tail_prefix'
    - 'puzzle_text?'
    - 'puzzle_empty_line?'
    - 'add_github_login'
    - 'get_json'
    - 'find_github_user'
    - 'find_github_login'
Elegant/GoodVariableName:
  Exclude:
    - '**/test_*.rb'
    - '**/*Test.rb'
Style/TopLevelMethodDefinition:
  Exclude:
    - 'Rakefile'
    - '**/test_*.rb'
Performance/ChainArrayAllocation:
  Enabled: false
Elegant/IndentationLadder:
  Exclude:
    - 'lib/pdd/source.rb'
    - 'test/test_source.rb'
    - 'test/test_source_todo.rb'
